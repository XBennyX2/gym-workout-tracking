version: 2.1

jobs:
  test:
    docker:
      - image: cimg/node:24.22
    steps:
      - checkout
      - run:
          name: JavaScript Syntax Tests
          command: |
            for file in js/*.js; do
              echo "Checking $file syntax..."
              node --check "$file"
            done
            echo "All JavaScript files passed syntax check!"

workflows:
  test_workflow:
    jobs:
      - test
